# 机器人轮廓
footprint: [[0.5, 0.4], [-0.5, 0.4], [-0.5, -0.4], [0.5, -0.4]]
footprint_padding: 0.02
map_type: costmap

# 障碍物探测与清除
obstacle_range: 3.0
raytrace_range: 5.0
clearing: true
clearing_interval: 1

# 障碍物膨胀
inflation_radius: 0.5
cost_scaling_factor: 2.0

# 激光扫描观测
observation_sources: scan
scan: {sensor_frame: body_2d, data_type: LaserScan, topic: /scan, marking: true, clearing: true, inf_is_valid: true}
